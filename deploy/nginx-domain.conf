map $http_upgrade $four_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 4inrow.ru www.4inrow.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://4inrow.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 4inrow.ru;
    ssl_certificate /etc/letsencrypt/live/4inrow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4inrow.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FOUR:10m;
    ssl_session_timeout 1d;

    # Serve the game only on its canonical domain, including for unknown hosts.
    if ($host != 4inrow.ru) {
        return 301 https://4inrow.ru$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/octet-stream model/gltf-binary image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $four_connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.4inrow.ru;
    ssl_certificate /etc/letsencrypt/live/4inrow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4inrow.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://4inrow.ru$request_uri;
}
